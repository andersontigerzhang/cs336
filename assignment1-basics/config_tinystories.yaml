data:
  train_data: output/tinystories_train.bin
  val_data: output/tinystories_valid.bin

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0
  device: cuda
  dtype: float32

optim:
  weight_decay: 0.1
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  max_learning_rate: 1e-3
  min_learning_rate: 1e-4
  warmup_iters: 2000
  cosine_cycle_iters: 106667

train:
  max_steps: 10000
  batch_size: 32
  max_l2_norm: 1.0
  seed: 42
  project: cs336_hw1
  output_dir: output
  checkpoint_dir: output/checkpoints
  log_interval: 10
  val_interval: 1000
  checkpoint_interval: 5000